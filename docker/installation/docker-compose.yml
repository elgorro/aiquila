# AIquila dev stack (local development).
# Resource limits below are deliberately looser than the production stacks in
# hetzner/docker/* — they exist to contain runaway processes, not to model prod
# sizing (the dev MCP server runs a tsx watcher and Nextcloud rebuilds assets).
services:
  # PostgreSQL Database
  db:
    image: postgres:18-alpine
    container_name: aiquila-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextcloud_secure_password}
    volumes:
      # postgres:18+ stores data in a major-version subdirectory and refuses to
      # start with a mount at /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiquila-network
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
          pids: 200

  # Redis Cache
  redis:
    image: redis:8-alpine
    container_name: aiquila-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aiquila-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
          pids: 100

  # Nextcloud with AIquila installed from tarball
  nextcloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiquila-nextcloud:latest
    container_name: aiquila-nextcloud
    restart: unless-stopped
    # Lets the local model provider reach a backend running on the host
    # (Ollama on :11434, LM Studio on :1234, llama-server on :8080) via
    # http://host.docker.internal:<port> — inside the container `localhost`
    # is the container itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &nc-env
      # Database
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextcloud_secure_password}

      # Redis
      REDIS_HOST: redis

      # Nextcloud Admin
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin123}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost localhost:8080 nextcloud}

      # SMTP (MailHog)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_AUTHTYPE: PLAIN
      MAIL_FROM_ADDRESS: noreply
      MAIL_DOMAIN: aiquila.local

      # AIquila setup
      AIQUILA_TEST_USER: ${NEXTCLOUD_TEST_USER:-testuser}
      AIQUILA_TEST_PASSWORD: ${NEXTCLOUD_TEST_PASSWORD:-AIquila2026!dev}
      AIQUILA_CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}

      # PHP limits, written into nextcloud.ini by the upstream entrypoint.
      # PHP_UPLOAD_LIMIT sets both upload_max_filesize and post_max_size; keep
      # it in step with request_body max_size in ../caddy/Caddyfile.
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT:-512M}
    volumes:
      - nextcloud_data:/var/www/html
    # Direct ports are bound to localhost: Docker-published ports bypass host
    # firewalls such as ufw. Only Caddy (443, 3340) is reachable from outside.
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - aiquila-network
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'
          pids: 400

  # Background jobs: the image's /cron.sh runs cron.php every 5 minutes. Reuses
  # the image built for nextcloud; the install hook sets the mode to "cron".
  nextcloud-cron:
    image: aiquila-nextcloud:latest
    pull_policy: never
    container_name: aiquila-nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      - nextcloud
    environment: *nc-env
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - aiquila-network
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
          pids: 100

  # MCP Server (Development)
  mcp-server:
    build:
      context: ../../mcp-server
      dockerfile: Dockerfile.dev
    container_name: aiquila-mcp
    restart: unless-stopped
    depends_on:
      - nextcloud
    environment:
      NEXTCLOUD_URL: http://nextcloud
      NEXTCLOUD_USER: ${NEXTCLOUD_TEST_USER:-testuser}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_TEST_PASSWORD:-AIquila2026!dev}
      NODE_ENV: development
      MCP_TRANSPORT: http
      MCP_PORT: "3339"
      MCP_ALLOW_UNAUTHENTICATED: "true"
    volumes:
      # Mount source for live development
      - ../../mcp-server:/app
      # Prevent node_modules from being overwritten
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    ports:
      - "127.0.0.1:3339:3339"
    networks:
      - aiquila-network
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'
          pids: 300

  # Caddy Reverse Proxy (HTTPS)
  caddy:
    image: caddy:2.11.2-alpine
    container_name: aiquila-caddy
    restart: unless-stopped
    depends_on:
      - nextcloud
      - mcp-server
    ports:
      - "443:443"
      - "3340:3340"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - aiquila-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '1.0'
          pids: 100

  # MailHog (Email Testing)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: aiquila-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"  # Web UI
      - "127.0.0.1:1025:1025"  # SMTP
    networks:
      - aiquila-network
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
          pids: 50

  # Adminer (Database UI) — opt-in: `make up-tools` or `docker compose --profile tools up -d`
  adminer:
    image: adminer:6.1.2
    container_name: aiquila-adminer
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - aiquila-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
          pids: 100

volumes:
  postgres_data:
    name: aiquila_postgres_data
  redis_data:
    name: aiquila_redis_data
  nextcloud_data:
    name: aiquila_nextcloud_data
  caddy_data:
    name: aiquila_caddy_data
  caddy_config:
    name: aiquila_caddy_config

networks:
  aiquila-network:
    name: aiquila-network
    driver: bridge
