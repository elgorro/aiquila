; PHP hardening for the AIquila dev stack. Loaded after the upstream
; nextcloud.ini (conf.d is read alphabetically), so these values win.
; The same settings are applied to the Hetzner stacks in hetzner/docker/*.

; Don't advertise the PHP version in X-Powered-By.
expose_php = Off

; Bound how deeply PHP nests GET/POST/cookie arrays while parsing input
; (default 64). Nextcloud's own forms and OCS calls stay far below this.
max_input_nesting_level = 32
max_input_vars = 1000

; Errors go to the log, never into a response.
display_errors = Off
display_startup_errors = Off
log_errors = On
