version: 2

updates:
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(mcp)"
    groups:
      mcp-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /nextcloud-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(nextcloud)"
    groups:
      nextcloud-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /hetzner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(hetzner)"
    groups:
      hetzner-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: composer
    directory: /nextcloud-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(nextcloud)"
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  # Dockerfile FROM lines. The tagging policy (docs/dev/ci-cd.md#docker-image-tags)
  # keeps these on floating majors, so this only raises major bumps.
  - package-ecosystem: docker
    directories:
      - /docker/installation
      - /mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch

  # image: lines in compose files. The docker ecosystem above does not read them.
  - package-ecosystem: docker-compose
    directories:
      - /docker/installation
      - /docker/standalone
      - /docker/e2e
      - /hetzner/docker/mcp
      - /hetzner/docker/nextcloud
      - /hetzner/docker/full
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    ignore:
      # A PostgreSQL major needs a dump and restore; see docs/dev/docker-setup.md.
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
    groups:
      compose-minor-and-patch:
        update-types:
          - minor
          - patch
