name: Hetzner CLI Release

on:
  push:
    branches:
      - main
    paths:
      - 'hetzner/**'
      - '!hetzner/**/*.md'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: check
        run: |
          CURRENT=$(cat hetzner/VERSION)
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

          PREVIOUS=$(git show HEAD~1:hetzner/VERSION 2>/dev/null || echo "0.0.0")
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT

          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed from $PREVIOUS to $CURRENT"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: $CURRENT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: hetzner/go.mod
          cache-dependency-path: hetzner/go.sum

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Build Linux binaries
        run: |
          VERSION=$(cat hetzner/VERSION)
          mkdir -p dist
          cd hetzner
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" \
            -o ../dist/aiquila-hetzner-linux-amd64 ./cmd/aiquila-hetzner
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${VERSION}" \
            -o ../dist/aiquila-hetzner-linux-arm64 ./cmd/aiquila-hetzner

      # cosign 3 signs into a Sigstore bundle and ignores --output-signature and
      # --output-certificate. Left to default the bundle path is empty, and every
      # signature fails with `create bundle file: open : no such file or directory`
      # — which is what stalled the 0.4.18 and 0.4.19 releases. One .sigstore.json
      # per artifact now carries both the signature and the certificate.
      #
      # Signing fetches an OIDC token from the runner for Fulcio. That endpoint
      # occasionally answers with a non-JSON error page (`fetching ambient OIDC
      # credentials: invalid character ...`), so each signature gets three tries.
      - name: Generate checksums and sign artifacts
        run: |
          cd dist
          sha256sum aiquila-hetzner-linux-amd64 aiquila-hetzner-linux-arm64 > checksums.txt
          for f in aiquila-hetzner-linux-amd64 aiquila-hetzner-linux-arm64 checksums.txt; do
            for attempt in 1 2 3; do
              cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}" && break
              if [ "${attempt}" = 3 ]; then exit 1; fi
              echo "::warning::Signing ${f} failed (attempt ${attempt}), retrying"
              sleep $((attempt * 15))
            done
          done

      - name: Generate changelog
        run: |
          VERSION=$(cat hetzner/VERSION)
          # Diff against the nearest earlier hetzner-v* tag reachable from HEAD, not the
          # tag named after the previous version: a release that failed before tagging
          # leaves that tag missing, and the notes would fall back to the whole history.
          # The excluded tag is this release's own, present when the job is re-run.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'hetzner-v*' --exclude "hetzner-v${VERSION}" HEAD 2>/dev/null || true)
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          CHANGELOG=$(git log ${RANGE} --pretty=format:"%s" -- hetzner/ | awk -F: '
            /^feat/  { feats = feats "\n- " substr($0, index($0,":")+2) }
            /^fix/   { fixes = fixes "\n- " substr($0, index($0,":")+2) }
            /^chore|^docs|^refactor|^perf|^ci|^test/ { other = other "\n- " substr($0, index($0,":")+2) }
            END {
              if (feats) printf "### Features%s\n\n", feats
              if (fixes) printf "### Bug Fixes%s\n\n", fixes
              if (other) printf "### Other Changes%s\n\n", other
            }
          ')

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No conventional commits found for this release."
          fi

          cat > /tmp/release-body.txt << ENDOFBODY
          ## aiquila-hetzner v${VERSION}

          ${CHANGELOG}

          Single-command provisioner for AIquila MCP Server on Hetzner Cloud.

          ### Installation

          \`\`\`bash
          # Linux amd64
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/hetzner-v${VERSION}/aiquila-hetzner-linux-amd64 \\
            -o aiquila-hetzner
          chmod +x aiquila-hetzner
          sudo mv aiquila-hetzner /usr/local/bin/

          # Linux arm64
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/hetzner-v${VERSION}/aiquila-hetzner-linux-arm64 \\
            -o aiquila-hetzner
          chmod +x aiquila-hetzner
          sudo mv aiquila-hetzner /usr/local/bin/
          \`\`\`

          ### Verify

          \`\`\`bash
          aiquila-hetzner --version
          \`\`\`

          ### Verify integrity

          **Checksum (simple):**
          \`\`\`bash
          sha256sum --check checksums.txt
          \`\`\`

          **Cosign (cryptographic, proves built by this repo's CI):**
          \`\`\`bash
          cosign verify-blob \\
            --bundle=aiquila-hetzner-linux-amd64.sigstore.json \\
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/hetzner-release.yml" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            aiquila-hetzner-linux-amd64
          \`\`\`

          ### Requirements
          - \`HCLOUD_TOKEN\` environment variable (Hetzner Cloud API token)
          - Nextcloud instance with app password

          ---
          *This release was automatically created by GitHub Actions*
          ENDOFBODY

          sed -i 's/^          //' /tmp/release-body.txt

      # The tag is created by the release API below rather than by `git push`.
      # GITHUB_TOKEN is a GitHub App token with no `workflows` scope — a scope the
      # `permissions:` block cannot grant — so git refuses any ref push whose tree
      # differs from the default branch under `.github/workflows/`. A second PR
      # touching a workflow merging between this commit and the tag push is enough
      # to trigger it, which is what broke the 0.4.14 release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          target_commitish: ${{ github.sha }}
          tag_name: hetzner-v${{ needs.check-version.outputs.version }}
          name: aiquila-hetzner v${{ needs.check-version.outputs.version }}
          body_path: /tmp/release-body.txt
          files: |
            dist/aiquila-hetzner-linux-amd64
            dist/aiquila-hetzner-linux-amd64.sigstore.json
            dist/aiquila-hetzner-linux-arm64
            dist/aiquila-hetzner-linux-arm64.sigstore.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
