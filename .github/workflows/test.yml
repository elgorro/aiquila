name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  mcp-server:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  nextcloud-app:
    name: Nextcloud App Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextcloud-app

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run tests
        run: composer test

      - name: Static analysis (psalm)
        run: composer psalm

      - name: Generate OpenAPI spec
        run: vendor/bin/generate-spec

      - name: Check OpenAPI spec is up to date
        run: |
          git diff --exit-code openapi.json openapi-administration.json openapi-full.json || {
            echo "::error::OpenAPI spec is out of date. Run 'make openapi' and commit the result."
            exit 1
          }

  hetzner-cli:
    name: Hetzner CLI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hetzner

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: hetzner/go.mod
          cache-dependency-path: hetzner/go.sum

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...
