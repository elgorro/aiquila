# GitHub label registry — the source of truth for this repo's labels.
# Apply with: gh label import .github/labels.yml
#
# Labels carry the component:* axis (one or more per issue or PR) and the
# cross-cutting markers. The kind of work is the issue type and the urgency is the
# Priority issue field, neither of which is a label. See CONTRIBUTING.md.
#
# Regenerate from the live set after changing labels via the API:
#   gh label list --limit 100 --json name,color,description \
#     --jq 'sort_by(.name) | .[] | "- name: \(.name)\n  color: \(.color)\n  description: \(.description)\n"'

- name: component:infrastructure
  color: 5319e7
  description: Docker, Hetzner CLI, CI

- name: component:mcp
  color: 1d76db
  description: MCP server (mcp-server/)

- name: component:nextcloud
  color: 006b75
  description: Nextcloud app (nextcloud-app/)

- name: dependencies
  color: 0366d6
  description: Pull requests that update a dependency file

- name: docker
  color: 21ceff
  description: Pull requests that update docker code

- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists

- name: github_actions
  color: 000000
  description: Pull requests that update GitHub Actions code

- name: go
  color: 16e2e2
  description: Pull requests that update go code

- name: good first issue
  color: 7057ff
  description: Good for newcomers

- name: help wanted
  color: 008672
  description: Extra attention is needed

- name: invalid
  color: e4e669
  description: This doesn't seem right

- name: javascript
  color: 168700
  description: Pull requests that update javascript code

- name: php
  color: 45229e
  description: Pull requests that update php code

- name: question
  color: d876e3
  description: Approach still being decided, not yet implementation

- name: security
  color: b60205
  description: Security vulnerability or hardening

- name: wontfix
  color: ffffff
  description: This will not be worked on

